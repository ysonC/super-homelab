apiVersion: v1
kind: Namespace
metadata:
  name: ai-agent

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-readonly
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - nodes
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch

  # Workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - get
      - list
      - watch

  # Jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch

  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch

  # Traefik
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - middlewares
    verbs:
      - get
      - list
      - watch

  # FluxCD - Helm
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch

  # FluxCD - Kustomize
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch

  # FluxCD - Sources
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
      - helmrepositories
      - buckets
    verbs:
      - get
      - list
      - watch

  # cert-manager
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
    verbs:
      - get
      - list
      - watch

  # Prometheus Operator: ServiceMonitor and PrometheusRule visibility.
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - prometheusrules
    verbs:
      - get
      - list
      - watch

  # Metrics API: enables kubectl top and basic pod/node usage checks.
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch

  # Storage API: allows viewing StorageClass definitions only.
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch

  # Longhorn API: volume robustness, actual size, replica, engine, and node visibility.
  - apiGroups: ["longhorn.io"]
    resources:
      - volumes
      - nodes
      - engines
      - replicas
      - settings
      - backingimages
      - recurringjobs
    verbs:
      - get
      - list
      - watch

  # External Secrets API: status and provider-store visibility only; generated Secrets remain excluded.
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - secretstores
      - clustersecretstores
      - clusterexternalsecrets
    verbs:
      - get
      - list
      - watch

  # CloudNativePG API: database cluster, backup, scheduled backup, and pooler status.
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters
      - backups
      - scheduledbackups
      - poolers
    verbs:
      - get
      - list
      - watch

  # Flux Source API: additional source artifact visibility for HelmChart and OCIRepository health.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - helmcharts
      - ocirepositories
    verbs:
      - get
      - list
      - watch

  # Traefik API: additional route, middleware, TLS, transport, and TraefikService visibility.
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutetcps
      - ingressrouteudps
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
      - traefikservices
    verbs:
      - get
      - list
      - watch

  # API registration API: APIService availability checks.
  - apiGroups: ["apiregistration.k8s.io"]
    resources:
      - apiservices
    verbs:
      - get
      - list
      - watch

  # Gateway API: read-only visibility if Gateway resources are introduced later.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - tlsroutes
      - tcproutes
      - udproutes
      - grpcroutes
      - referencegrants
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-readonly
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: ai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-readonly
