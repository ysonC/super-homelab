apiVersion: v1
kind: Namespace
metadata:
  name: cyber-academy
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cyber-academy-db
  namespace: cyber-academy
spec:
  instances: 1
  bootstrap:
    initdb:
      database: academy
      owner: academy_owner
      postInitApplicationSQL:
        - "CREATE ROLE academy_runtime LOGIN PASSWORD 'academy-runtime-local-test';"
  storage:
    storageClass: longhorn
    size: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-academy
  namespace: cyber-academy
  labels:
    app.kubernetes.io/name: cyber-academy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-academy
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-academy
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: docker.io/wyson002/cyber-academy:latest
          imagePullPolicy: Always
          workingDir: /workspace/app
          command: [node, scripts/migrate.mjs]
          args: [--release, --grant-homelab-runtime]
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cyber-academy-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: web
          image: docker.io/wyson002/cyber-academy:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4321
          env:
            - name: DATABASE_URL
              value: "postgresql://academy_runtime:academy-runtime-local-test@cyber-academy-db-rw:5432/academy"
            - name: APP_ORIGIN
              value: "https://academy.example.com"
            - name: CF_ACCESS_ISSUER
              value: "https://your-team.cloudflareaccess.com"
            - name: CF_ACCESS_AUD
              value: "replace-with-access-audience"
            - name: TUTOR_EMAIL
              value: "tutor@example.com"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const {Client} = require('pg');
                  const db = new Client({connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 3000});
                  (async () => {
                    const response = await fetch('http://127.0.0.1:4321/api/health');
                    if (!response.ok) throw new Error('Portal health check failed');
                    await db.connect();
                    try {
                      await db.query('SELECT 1 FROM users LIMIT 0');
                    } finally {
                      await db.end();
                    }
                  })().catch(() => process.exit(1));
            periodSeconds: 10
            timeoutSeconds: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-academy
  namespace: cyber-academy
  labels:
    app.kubernetes.io/name: cyber-academy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cyber-academy
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 4321
      targetPort: http
