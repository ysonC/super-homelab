apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: cyber-academy-db-runtime
  namespace: apps
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cyber-academy-db-runtime
  namespace: apps
spec:
  refreshPolicy: CreatedOnce
  target:
    name: cyber-academy-db-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: academy_runtime
        password: '{{ .password }}'
        uri: 'postgresql://academy_runtime:{{ .password }}@cyber-academy-db-rw:5432/academy'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: cyber-academy-db-runtime
