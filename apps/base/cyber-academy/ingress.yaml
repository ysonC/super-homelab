apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cyber-academy-ingress-certificate
  namespace: apps
spec:
  secretName: cyber-academy-certificate-secret
  issuerRef:
    name: cloudflare-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
    - academy.ysonsbaolab.dev
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cyber-academy-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`academy.ysonsbaolab.dev`)
      kind: Rule
      services:
        - name: cyber-academy-service
          port: 4321
  tls:
    secretName: cyber-academy-certificate-secret
